<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Petoi Bittle X — 3D CAD Dance Demo</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0e17;
      color: #f8fafc;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #stage {
      position: relative;
      flex: 1;
      width: 100%;
      background: radial-gradient(circle at 50% 35%, #221a35 0%, #0b0e17 75%);
    }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }

    .top-pill {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      max-width: 460px;
      background: rgba(16, 21, 34, 0.90);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(245, 184, 46, 0.30);
      border-left: 4px solid #f5b82e;
      border-radius: 12px;
      padding: 11px 15px;
      pointer-events: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    }
    .tag {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #f5b82e;
      margin-bottom: 3px;
    }
    .move-title {
      font-size: 16.5px;
      font-weight: 800;
      color: #fff;
    }
    .move-sub {
      font-size: 11.5px;
      color: #cbd5e1;
      margin-top: 2px;
    }

    .cam-pills {
      position: absolute;
      bottom: 12px;
      left: 14px;
      display: flex;
      gap: 6px;
      background: rgba(16, 21, 34, 0.88);
      padding: 5px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .cam-btn {
      background: rgba(255,255,255,0.06);
      color: #e2e8f0;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 7px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .cam-btn.active {
      background: rgba(56, 189, 248, 0.22);
      border-color: #38bdf8;
      color: #38bdf8;
    }

    .bottom-dock {
      background: #101522;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .play-btn {
      width: 100%;
      background: linear-gradient(135deg, #f59e0b, #e11d48);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 13px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(225, 29, 72, 0.4);
    }
    .chips {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }
    .chip {
      background: rgba(255, 255, 255, 0.06);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 10px;
      padding: 9px 6px;
      font-size: 11.5px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chip.active {
      background: rgba(56, 189, 248, 0.22);
      border-color: #38bdf8;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="c"></canvas>
    <div class="top-pill">
      <div class="tag" id="hud-tag">PETOI BITTLE X • OFFICIAL 40-PART CAD + 500Hz MUJOCO</div>
      <div class="move-title" id="hud-title">🚂 Chaiyya Chaiyya Dance Routine</div>
      <div class="move-sub" id="hud-sub">Loading official Petoi Bittle X 3D CAD meshes...</div>
    </div>

    <div class="cam-pills">
      <button class="cam-btn active" data-cam="hero">🎬 3/4 Cam</button>
      <button class="cam-btn" data-cam="front">🐶 Face Cam</button>
      <button class="cam-btn" data-cam="side">📐 Side Cam</button>
      <button class="cam-btn" data-cam="top">🛸 Top Cam</button>
    </div>
  </div>

  <div class="bottom-dock">
    <button class="play-btn" id="btn-music">▶ Play Chaiyya Chaiyya Song + Dance (34s)</button>
    <div class="chips">
      <div class="chip active" data-mode="seq_companion">🐶 Companion (24s)</div>
      <div class="chip" data-mode="seq_groove">🕺 Groove & DJ (28s)</div>
      <div class="chip" data-mode="seq_fitness">💪 Fitness (27s)</div>
      <div class="chip" data-mode="hi">👋 Say Hi Wave</div>
      <div class="chip" data-mode="gdb">🐕 Play-Bow</div>
      <div class="chip" data-mode="pu">💪 Push-Ups</div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x121020, 0.9);

    const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 20);
    camera.position.set(0.26, -0.26, 0.17);
    camera.up.set(0, 0, 1);

    const controls = new OrbitControls(camera, canvas);
    controls.target.set(0, 0, 0.06);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;

    const hemiLight = new THREE.HemisphereLight(0xffeedd, 0x222940, 1.45);
    hemiLight.position.set(0, 0, 2);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xffc988, 2.5);
    sunLight.position.set(0.5, -0.6, 0.9);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(1024, 1024);
    scene.add(sunLight);

    const rimLight = new THREE.SpotLight(0x38bdf8, 1.8, 3.0, Math.PI / 3, 0.5);
    rimLight.position.set(-0.5, 0.6, 0.45);
    scene.add(rimLight);

    // Stage Platform
    const stageGroup = new THREE.Group();
    scene.add(stageGroup);

    const padGeo = new THREE.CylinderGeometry(0.32, 0.34, 0.016, 64);
    padGeo.rotateX(Math.PI / 2);
    const padMat = new THREE.MeshStandardMaterial({ color: 0x1a2234, roughness: 0.4, metalness: 0.25 });
    const padMesh = new THREE.Mesh(padGeo, padMat);
    padMesh.position.set(0, 0, -0.018);
    padMesh.receiveShadow = true;
    stageGroup.add(padMesh);

    const ringGeo = new THREE.RingGeometry(0.15, 0.162, 64);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0xf5b82e, side: THREE.DoubleSide });
    const stageRing = new THREE.Mesh(ringGeo, ringMat);
    stageRing.position.set(0, 0, -0.0095);
    stageGroup.add(stageRing);

    const gridHelper = new THREE.GridHelper(0.8, 16, 0x38bdf8, 0x1e293b);
    gridHelper.rotation.x = Math.PI / 2;
    gridHelper.position.set(0, 0, -0.0098);
    stageGroup.add(gridHelper);

    // =========================================================================
    // LOAD ALL 40 OFFICIAL PETOI BITTLE X CAD (.OBJ) MESHES
    // =========================================================================
    const MATS = {
      yellow: new THREE.MeshStandardMaterial({ color: 0xf2b318, roughness: 0.32, metalness: 0.1 }),
      blue:   new THREE.MeshStandardMaterial({ color: 0x2548b8, roughness: 0.35, metalness: 0.15 }),
      red:    new THREE.MeshStandardMaterial({ color: 0xd91c24, roughness: 0.35, metalness: 0.15 }),
      black:  new THREE.MeshStandardMaterial({ color: 0x181b22, roughness: 0.45, metalness: 0.25 }),
      dark:   new THREE.MeshStandardMaterial({ color: 0x12141a, roughness: 0.5, metalness: 0.2 }),
    };

    const bittleRoot = new THREE.Group();
    bittleRoot.position.set(0, 0, 0.056);
    scene.add(bittleRoot);

    const torsoGroup = new THREE.Group();
    bittleRoot.add(torsoGroup);

    function makePivot(parent, x, y, z) {
      const g = new THREE.Group();
      g.position.set(x, y, z);
      parent.add(g);
      return g;
    }

    const pivots = {
      neck:  makePivot(torsoGroup,  0.047554,  0.0,      0.035941),
      rf_sh: makePivot(torsoGroup,  0.0525,   -0.0485,   0.022),
      rr_sh: makePivot(torsoGroup, -0.0525,   -0.0485,   0.022),
      lf_sh: makePivot(torsoGroup,  0.0525,    0.0485,   0.022),
      lr_sh: makePivot(torsoGroup, -0.0525,    0.0485,   0.022),
    };
    pivots.rf_kn = makePivot(pivots.rf_sh, -0.044433,  0.00142, -0.011906);
    pivots.rr_kn = makePivot(pivots.rr_sh, -0.044433,  0.00142, -0.011906);
    pivots.lf_kn = makePivot(pivots.lf_sh, -0.044433, -0.00142, -0.011906);
    pivots.lr_kn = makePivot(pivots.lr_sh, -0.044433, -0.00142, -0.011906);

    const MESH_MANIFEST = [
      { file: 'base_link.obj',    parent: torsoGroup, mat: MATS.yellow, off: [0, 0, 0] },
      { file: 'front__1.obj',     parent: torsoGroup, mat: MATS.blue,   off: [0, 0, 0] },
      { file: 'rear__1.obj',      parent: torsoGroup, mat: MATS.blue,   off: [0, 0, 0] },
      { file: 'cover_1.obj',      parent: torsoGroup, mat: MATS.dark,   off: [0, 0, 0] },
      { file: 'battery_1.obj',    parent: torsoGroup, mat: MATS.dark,   off: [0, 0, 0] },
      { file: 'c_neck__1.obj',    parent: torsoGroup, mat: MATS.blue,   off: [0, 0, 0] },
      { file: 'servo_rfs_1.obj',  parent: torsoGroup, mat: MATS.black,  off: [0, 0, 0] },
      { file: 'servo_rrs__1.obj', parent: torsoGroup, mat: MATS.black,  off: [0, 0, 0] },
      { file: 'servo_lfs_1.obj',  parent: torsoGroup, mat: MATS.black,  off: [0, 0, 0] },
      { file: 'servo_lrs__1.obj', parent: torsoGroup, mat: MATS.black,  off: [0, 0, 0] },

      { file: 'servo_neck__1.obj', parent: pivots.neck, mat: MATS.black,  off: [-0.047554, 0, -0.035941] },
      { file: 'jaw_1.obj',         parent: pivots.neck, mat: MATS.blue,   off: [-0.047554, 0, -0.035941] },
      { file: 'head__1.obj',       parent: pivots.neck, mat: MATS.yellow, off: [-0.047554, 0, -0.035941] },

      { file: 'c_thrf__1.obj',   parent: pivots.rf_sh, mat: MATS.red,   off: [-0.0525, 0.0485, -0.022] },
      { file: 'th_rf_1.obj',     parent: pivots.rf_sh, mat: MATS.red,   off: [-0.0525, 0.0485, -0.022] },
      { file: 'tho_rf__1.obj',   parent: pivots.rf_sh, mat: MATS.red,   off: [-0.0525, 0.0485, -0.022] },
      { file: 'c_thorf_1.obj',   parent: pivots.rf_sh, mat: MATS.red,   off: [-0.0525, 0.0485, -0.022] },
      { file: 'tube__1.obj',     parent: pivots.rf_sh, mat: MATS.red,   off: [-0.0525, 0.0485, -0.022] },
      { file: 'servos_rf_1.obj', parent: pivots.rf_kn, mat: MATS.black, off: [-0.008067, 0.04708, -0.010094] },
      { file: 'shank_rf_1.obj',  parent: pivots.rf_kn, mat: MATS.blue,  off: [-0.008067, 0.04708, -0.010094] },

      { file: 'c_thrr_1.obj',    parent: pivots.rr_sh, mat: MATS.red,   off: [0.0525, 0.0485, -0.022] },
      { file: 'th_rr_1.obj',     parent: pivots.rr_sh, mat: MATS.red,   off: [0.0525, 0.0485, -0.022] },
      { file: 'tho_rr_1.obj',    parent: pivots.rr_sh, mat: MATS.red,   off: [0.0525, 0.0485, -0.022] },
      { file: 'c_thorr_1.obj',   parent: pivots.rr_sh, mat: MATS.red,   off: [0.0525, 0.0485, -0.022] },
      { file: 'tube_rr_1.obj',   parent: pivots.rr_sh, mat: MATS.red,   off: [0.0525, 0.0485, -0.022] },
      { file: 'servos_rr_1.obj', parent: pivots.rr_kn, mat: MATS.black, off: [0.096933, 0.04708, -0.010094] },
      { file: 'shank_rr_1.obj',  parent: pivots.rr_kn, mat: MATS.blue,  off: [0.096933, 0.04708, -0.010094] },

      { file: 'c_thlf_1.obj',    parent: pivots.lf_sh, mat: MATS.red,   off: [-0.0525, -0.0485, -0.022] },
      { file: 'th_lf_1.obj',     parent: pivots.lf_sh, mat: MATS.red,   off: [-0.0525, -0.0485, -0.022] },
      { file: 'tho_lf_1.obj',    parent: pivots.lf_sh, mat: MATS.red,   off: [-0.0525, -0.0485, -0.022] },
      { file: 'c_tholf_1.obj',   parent: pivots.lf_sh, mat: MATS.red,   off: [-0.0525, -0.0485, -0.022] },
      { file: 'tube_lf_1.obj',   parent: pivots.lf_sh, mat: MATS.red,   off: [-0.0525, -0.0485, -0.022] },
      { file: 'servos_lf_1.obj', parent: pivots.lf_kn, mat: MATS.black, off: [-0.008067, -0.04708, -0.010094] },
      { file: 'shank_lf_1.obj',  parent: pivots.lf_kn, mat: MATS.blue,  off: [-0.008067, -0.04708, -0.010094] },

      { file: 'c_thlr_1.obj',    parent: pivots.lr_sh, mat: MATS.red,   off: [0.0525, -0.0485, -0.022] },
      { file: 'th_lr__1.obj',    parent: pivots.lr_sh, mat: MATS.red,   off: [0.0525, -0.0485, -0.022] },
      { file: 'tho_lr_1.obj',    parent: pivots.lr_sh, mat: MATS.red,   off: [0.0525, -0.0485, -0.022] },
      { file: 'c_tholr__1.obj',  parent: pivots.lr_sh, mat: MATS.red,   off: [0.0525, -0.0485, -0.022] },
      { file: 'tube_lr_1.obj',   parent: pivots.lr_sh, mat: MATS.red,   off: [0.0525, -0.0485, -0.022] },
      { file: 'servos_lr_1.obj', parent: pivots.lr_kn, mat: MATS.black, off: [0.096933, -0.047082, -0.010094] },
      { file: 'shank_lr_1.obj',  parent: pivots.lr_kn, mat: MATS.blue,  off: [0.096933, -0.047082, -0.010094] },
    ];

    let loadedCount = 0;
    const objLoader = new OBJLoader();
    const MESH_BASE_URL = './sim_assets/bittle-mujoco/meshes_obj/';
    MESH_MANIFEST.forEach((item) => {
      objLoader.load(MESH_BASE_URL + item.file, (obj) => {
        obj.traverse((child) => {
          if (child.isMesh) {
            child.material = item.mat;
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });
        obj.scale.set(0.001, 0.001, 0.001);
        obj.position.set(item.off[0], item.off[1], item.off[2]);
        item.parent.add(obj);
        loadedCount++;
        if (loadedCount === MESH_MANIFEST.length) {
          document.getElementById('hud-sub').textContent = '1-finger drag to orbit • Tap any routine below!';
        }
      });
    });

    const NECK_AXIS = new THREE.Vector3(-0.5, 0, -0.866025).normalize();

    function applyPoseToRobot(qpos9, posXYZ, quatWXYZ) {
      pivots.neck.setRotationFromAxisAngle(NECK_AXIS, qpos9[0]);
      pivots.rf_sh.rotation.set(0, qpos9[1], 0);
      pivots.rf_kn.rotation.set(0, qpos9[2], 0);
      pivots.rr_sh.rotation.set(0, -qpos9[3], 0);
      pivots.rr_kn.rotation.set(0, qpos9[4], 0);
      pivots.lf_sh.rotation.set(0, qpos9[5], 0);
      pivots.lf_kn.rotation.set(0, qpos9[6], 0);
      pivots.lr_sh.rotation.set(0, -qpos9[7], 0);
      pivots.lr_kn.rotation.set(0, qpos9[8], 0);

      if (posXYZ) bittleRoot.position.set(posXYZ[0], posXYZ[1], posXYZ[2]);
      if (quatWXYZ) bittleRoot.quaternion.set(quatWXYZ[1], quatWXYZ[2], quatWXYZ[3], quatWXYZ[0]);
    }

    // =========================================================================
    // LOAD REAL 500Hz MUJOCO TRAJECTORIES & CHAIYYA AUDIO
    // =========================================================================
    let movesMap = {};
    let sequencesMap = {};
    let activeClip = null;
    let clipElapsed = 0.0;
    let inChaiyyaMode = false;

    fetch('./bittle_moves_library.json?v=verified3')
      .then((r) => r.json())
      .then((data) => {
        data.moves.forEach((m) => { movesMap[m.key] = m; });
        (data.sequences || []).forEach((s) => { sequencesMap[s.id] = s; });
        selectClip('seq_companion');
      });

    const audio = new Audio('./chaiyya_audio.m4a?v=1');
    audio.loop = true;
    let chaiyyaTraj = null;
    fetch('./mujoco_trajectory.json?v=real2').then((r) => r.json()).then((d) => { chaiyyaTraj = d; }).catch(() => {});

    function selectClip(modeKey) {
      inChaiyyaMode = false;
      audio.pause();
      document.getElementById('btn-music').textContent = '▶ Play Chaiyya Chaiyya Song + Dance (34s)';

      const clip = sequencesMap[modeKey] || movesMap[modeKey];
      if (!clip) return;
      activeClip = clip;
      clipElapsed = 0.0;
      document.getElementById('hud-title').textContent = clip.name;
      document.getElementById('hud-sub').textContent = clip.description || clip.vibe;
    }

    document.getElementById('btn-music').addEventListener('click', () => {
      if (!inChaiyyaMode) {
        inChaiyyaMode = true;
        document.querySelectorAll('.chip').forEach((c) => c.classList.remove('active'));
        audio.currentTime = 0;
        audio.play().catch(() => {});
        document.getElementById('btn-music').textContent = '⏹ Stop Chaiyya Chaiyya Song';
      } else {
        selectClip('seq_companion');
        document.querySelector('[data-mode="seq_companion"]').classList.add('active');
      }
    });

    document.querySelectorAll('.chip').forEach((chip) => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.chip').forEach((c) => c.classList.remove('active'));
        chip.classList.add('active');
        selectClip(chip.dataset.mode);
      });
    });

    document.querySelectorAll('.cam-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.cam-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        const mode = btn.dataset.cam;
        if (mode === 'hero')  camera.position.set(0.26, -0.26, 0.17);
        if (mode === 'front') camera.position.set(0.32,  0.00, 0.11);
        if (mode === 'side')  camera.position.set(0.00, -0.35, 0.11);
        if (mode === 'top')   camera.position.set(0.02, -0.02, 0.42);
        controls.target.set(0, 0, 0.06);
        controls.update();
      });
    });

    function resize() {
      const stage = document.getElementById('stage');
      renderer.setSize(stage.clientWidth, stage.clientHeight, false);
      camera.aspect = stage.clientWidth / stage.clientHeight;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();

    let last = performance.now();
    function animate(now) {
      requestAnimationFrame(animate);
      const dt = (now - last) * 0.001;
      last = now;

      if (inChaiyyaMode && chaiyyaTraj && !audio.paused) {
        const t = audio.currentTime % chaiyyaTraj.duration_sec;
        const idx = Math.min(chaiyyaTraj.frames.length - 1, Math.floor(t * chaiyyaTraj.fps));
        const f = chaiyyaTraj.frames[idx];
        applyPoseToRobot(f.qpos_joints, f.pos, f.quat);
        document.getElementById('hud-title').textContent = f.lyric_cue;
        document.getElementById('hud-sub').textContent = `${f.section} • ${f.pose_label}`;
      } else if (activeClip && activeClip.frames && activeClip.frames.length > 0) {
        clipElapsed = (clipElapsed + dt) % activeClip.duration_sec;
        const fIdx = Math.min(
          activeClip.frames.length - 1,
          Math.max(0, Math.floor(clipElapsed * activeClip.fps))
        );
        const f = activeClip.frames[fIdx];
        applyPoseToRobot(f.mj_qpos9, f.mj_pos, f.mj_quat);
        if (f.move_key && movesMap[f.move_key]) {
          document.getElementById('hud-sub').textContent =
            `Now Executing: ${movesMap[f.move_key].name} (${clipElapsed.toFixed(1)}s / ${activeClip.duration_sec}s)`;
        }
      }

      controls.update();
      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);
  </script>
</body>
</html>
